name: mobbs
x-app: &app
  build:
    context: .
    args:
      APP_COMMIT: ${APP_COMMIT:-local}
  environment: &environment
    DATABASE_URL: postgresql://mobbs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mobbs
    S3_ENDPOINT: http://storage:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    S3_BUCKET: ${S3_BUCKET:-mobbs}
    MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in .env}
    MOBBS_PROVIDER_MODE: standard
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mobbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mobbs
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mobbs -d mobbs']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  storage:
    image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes: [media-data:/data]
    command: [/data]
    restart: unless-stopped
  init:
    <<: *app
    restart: on-failure
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
    command: [python, -m, apps.api.app.bootstrap, --create-bucket]
  web:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8000:8000']
  worker:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    command: [python, -m, apps.api.app.worker]
volumes:
  postgres-data:
  media-data:
